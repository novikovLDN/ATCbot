<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Brand-neutral on purpose: the name, accent and theme colour are
         applied at runtime from GET /dashboard/api/branding (app/branding.py). -->
    <title>Admin</title>

    <!-- PWA manifest is generated by the backend from the same brand config. -->
    <link rel="manifest" href="/dashboard/api/branding/manifest.webmanifest" />
    <!-- Matches the default (dark-tile) look's wall; prefs.ts updates it on theme switch. -->
    <meta name="theme-color" content="#CFCECA" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/dashboard/icon.svg" />
    <link rel="apple-touch-icon" href="/dashboard/apple-touch-icon.png" />
    <link rel="mask-icon" href="/dashboard/icon-mono.svg" color="#1E1E1E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Onest: geometric grotesque with first-class Cyrillic and tabular
         figures. Geist Mono for technical values (keys, UUIDs, IPs). -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
