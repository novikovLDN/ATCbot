<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Brand-neutral on purpose: the name and logo are applied at runtime
         from GET /dashboard/api/branding (app/branding.py). -->
    <title>Admin</title>

    <!-- PWA manifest is generated by the backend from the same brand config. -->
    <link rel="manifest" href="/dashboard/api/branding/manifest.webmanifest" />
    <!-- iOS grouped background per system theme; store/prefs.ts pins both
         to one colour when the theme is chosen manually. -->
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default": the installed app gets a solid status bar that follows the
         system appearance (dark text on light, light text on dark) and the
         page starts below it. "black-translucent" always draws white text,
         which is unreadable over the light #F2F2F7 background. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/dashboard/icon.svg" />
    <link rel="apple-touch-icon" href="/dashboard/apple-touch-icon.png" />
    <link rel="mask-icon" href="/dashboard/icon-mono.svg" color="#007AFF" />
    <!-- No web fonts: the system font (SF Pro on iPhone) is what native apps use. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
