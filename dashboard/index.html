<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Atlas Admin</title>

    <!-- PWA / iOS standalone -->
    <link rel="manifest" href="/dashboard/manifest.webmanifest" />
    <!-- Цвет системной панели совпадает с фоном страницы в каждой теме:
         ступень 2 нейтральной шкалы в светлой, ступень 1 в тёмной. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F9FB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0E12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas Admin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Atlas Admin" />

    <!-- App icons.  SVG renders crisp on Safari ≥ 14 and Chrome.
         Apple still expects PNG fallbacks at 180×180 for older OS;
         our icons are vector and Safari maps them automatically. -->
    <link rel="icon" type="image/svg+xml" href="/dashboard/icon.svg" />
    <link rel="apple-touch-icon" href="/dashboard/apple-touch-icon.png" />
    <link rel="mask-icon" href="/dashboard/icon-mono.svg" color="#2A5BD7" />

    <!-- Шрифты лежат локально (public/fonts), @font-face — в
         src/styles/tokens.css. Google Fonts убран сознательно: панель должна
         открываться там, где к чужим доменам доступа нет, и не сообщать
         стороннему серверу, кто и когда зашёл в админку.
         Предзагружаем два сабсета из семи — кириллицу Inter (на ней весь
         интерфейс) и латиницу Inter (цифры, ID, названия провайдеров).
         Остальные браузер возьмёт по unicode-range, когда встретит символ. -->
    <link rel="preload" as="font" type="font/woff2" href="/dashboard/fonts/inter-cyrillic.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/dashboard/fonts/inter-latin.woff2" crossorigin />
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
