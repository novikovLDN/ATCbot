# RF-1 nginx — простой HTTPS reverse-proxy для sub-aggregator.
#
# Никаких WG / stream / TCP passthrough. Обычный nginx с LE-сертом,
# терминирует TLS от клиента, проксирует HTTPS на Railway.
#
# Установка:
#   1. sudo apt install nginx certbot python3-certbot-nginx
#   2. Подставить в файле:
#         SUB_DOMAIN     → subscription.palantirdns.uk
#         BOT_UPSTREAM   → api.atlassecure.ru
#   3. sudo cp этот файл → /etc/nginx/sites-available/subscription
#   4. sudo ln -s /etc/nginx/sites-available/subscription /etc/nginx/sites-enabled/
#   5. sudo certbot --nginx -d subscription.palantirdns.uk --agree-tos --email admin@...
#      (certbot автоматом впишет ssl_certificate/ssl_certificate_key в конфиг)
#   6. sudo nginx -t && sudo systemctl reload nginx
#
# После этого:
#   Клиент → https://subscription.palantirdns.uk/a/{token}
#         → RF-1 nginx (TLS + LE-cert валидный)
#         → https://api.atlassecure.ru/a/{token}
#         → Bot FastAPI embedded aggregator
#         → merge premium+bypass sub → base64 → response

# ── HTTP → HTTPS redirect + LE webroot challenge ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name subscription.palantirdns.uk;

    # webroot для LE renewal
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name subscription.palantirdns.uk;

    # ssl_certificate + ssl_certificate_key впишет certbot автоматом.
    # Или вручную:
    # ssl_certificate     /etc/letsencrypt/live/subscription.palantirdns.uk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/subscription.palantirdns.uk/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Rate-limit: 60 req/min per IP, burst 30 — щедро для sub клиентов,
    # которые обычно ходят раз/6h, но не даёт заскриптовать перебор токенов.
    limit_req_zone $binary_remote_addr zone=sub_agg:10m rate=60r/m;

    # Логи в отдельный файл — легко смотреть sub-трафик.
    access_log /var/log/nginx/sub-aggregator.access.log;
    error_log  /var/log/nginx/sub-aggregator.error.log warn;

    # Основной путь: /a/{token} → бот на Railway.
    location /a/ {
        limit_req zone=sub_agg burst=30 nodelay;

        # HTTPS-to-HTTPS proxy. api.atlassecure.ru — публичный домен бота на Railway.
        # HTTP/1.1 обязательно (не 1.0), keep-alive для reuse TCP.
        proxy_pass https://api.atlassecure.ru;
        proxy_http_version 1.1;
        proxy_set_header Host api.atlassecure.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Форвардим User-Agent как есть — агрегатор его использует в
        # запросе к панели (чтоб панель отдала правильный формат
        # для конкретного клиента).
        proxy_set_header User-Agent $http_user_agent;
        # Убираем "connection: keep-alive" который может кэшироваться апстримом.
        proxy_set_header Connection "";

        # Таймауты: панель + бот суммарно должны уложиться в 10 сек.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Не буферизуем — sub-body маленький, streaming быстрее.
        proxy_buffering off;
    }

    # Всё остальное — 404 (не проксируем никаких других путей на бота,
    # чтобы не палить /telegram/webhook и т.п.).
    location / {
        return 404 "Not found";
        add_header Content-Type text/plain;
    }
}
