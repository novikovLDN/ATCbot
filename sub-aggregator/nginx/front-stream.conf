## nginx/front-stream.conf — identical on RF-1 and RF-2.
##
## TCP passthrough: :443 accepts, forwards raw bytes to the origin's WG
## address. TLS is terminated on the origin, so the front never touches
## certificates and can be rotated without cert wrangling.
##
## Install as a top-level stream {} block (or /etc/nginx/nginx.conf) — this
## is NOT a `server {}` inside http {}.
##
## Substitute:
##   ORIGIN_WG_IP — origin's WireGuard address (e.g. 10.8.0.1)
##   ORIGIN_PORT  — 443
##
## Requirements: nginx built with --with-stream (default on Debian/Ubuntu).

stream {
    log_format sub_stream '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time "$upstream_addr" '
                         '"$upstream_connect_time" "$upstream_first_byte_time"';
    access_log /var/log/nginx/sub-stream.access.log sub_stream;
    error_log  /var/log/nginx/sub-stream.error.log;

    upstream origin_backend {
        server ORIGIN_WG_IP:ORIGIN_PORT max_fails=3 fail_timeout=10s;
        # Uncomment if origin has multiple WG addresses:
        # server 10.8.0.1:443 max_fails=3 fail_timeout=10s backup;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;

        proxy_pass origin_backend;

        # Fast fail if origin/WG dies — DNS-failover will move traffic to RF-2.
        proxy_connect_timeout 3s;
        proxy_timeout         15s;

        # PROXY protocol OFF — origin nginx does not expect it in http{}.
        # If you want the origin to see real client IPs, add
        # `set_real_ip_from` + PROXY protocol on BOTH sides.
    }
}
