## nginx/front-stream.conf — identical on RF-1 and RF-2.
##
## TCP passthrough: :443 accepts, forwards raw bytes to the origin's WG
## address. TLS is terminated on the origin, so the front never touches
## certificates and can be rotated without cert wrangling.
##
## PROXY protocol v2 is sent to origin so it sees real client IPs
## (`proxy_protocol on;` here + `listen 443 ssl proxy_protocol;` on origin).
##
## Устанавливай ЦЕЛИКОМ в /etc/nginx/nginx.conf (или /etc/nginx/streams-enabled/,
## если Debian/Ubuntu настроен с include stream). НЕ помещай внутрь http {}.
##
## Substitute (или используй scripts/install-front.sh):
##   ORIGIN_WG_IP — origin's WireGuard address (например 10.8.0.1)
##   ORIGIN_PORT  — 443
##
## Requirements: nginx built with --with-stream (default on Debian 12 / Ubuntu 22).
## Проверить: `nginx -V 2>&1 | grep -o with-stream`.

# nginx.conf minimal top-level (worker_processes/events нужны, если этот
# файл заменяет /etc/nginx/nginx.conf целиком):
user  www-data;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections  8192;
    multi_accept        on;
}

stream {
    log_format sub_stream '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time "$upstream_addr" '
                         '"$upstream_connect_time" "$upstream_first_byte_time"';
    access_log /var/log/nginx/sub-stream.access.log sub_stream buffer=64k flush=5s;
    error_log  /var/log/nginx/sub-stream.error.log;

    # Origin, доступный через WireGuard. max_fails/fail_timeout — health
    # для стрима: если 3 подряд TCP-подключения падают за 10 сек, nginx
    # временно исключает upstream. DNS-failover уводит трафик со всей
    # RF-1/RF-2 ноды в течение минуты.
    upstream origin_backend {
        server ORIGIN_WG_IP:ORIGIN_PORT max_fails=3 fail_timeout=10s;
    }

    server {
        # reuseport — распределение accept'ов между worker'ами (throughput).
        listen 443 reuseport;
        listen [::]:443 reuseport;

        proxy_pass origin_backend;

        # PROXY protocol v2 — origin увидит реальный IP клиента.
        # Origin `listen 443 ssl proxy_protocol;` обязательно.
        proxy_protocol on;

        # Быстрый fail на битом origin/WG — DNS-failover переключит DNS.
        proxy_connect_timeout 3s;
        # 15 сек — с запасом на выкачивание полной подписки, но не бесконечно.
        proxy_timeout         15s;

        # ⚠️ ssl_preread НЕ включаем — мы не смотрим SNI, только тупо
        # проксируем байты. Меньше DPI-fingerprint (не логируем hostname).
    }
}
