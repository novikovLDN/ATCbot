## nginx/origin.conf — deploy on the bot server (origin).
##
## Terminates TLS for <SUB_DOMAIN>. Forwards to 127.0.0.1:8080 (aggregator).
## /internal/ is denied from the outside (defence-in-depth on top of the
## secret headers). /metrics is exposed only to the WireGuard subnet.
##
## Variables to substitute before install:
##   SUB_DOMAIN — новый домен агрегатора (e.g. sub.atlassecure.io)
##   ACME_DIR   — путь к webroot для acme-challenge
##   TLS_CERT   — /etc/letsencrypt/live/${SUB_DOMAIN}/fullchain.pem
##   TLS_KEY    — /etc/letsencrypt/live/${SUB_DOMAIN}/privkey.pem
##   WG_CIDR    — WireGuard subnet allowed to hit /metrics (e.g. 10.8.0.0/24)

# Rate-limit zone shared across workers. 30 req/min per client IP, burst 15.
limit_req_zone $binary_remote_addr zone=sub_agg_zone:10m rate=30r/m;

server {
    listen 80;
    server_name  SUB_DOMAIN;

    # ACME challenge — pass through, everything else redirects.
    location /.well-known/acme-challenge/ {
        root ACME_DIR;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name  SUB_DOMAIN;

    ssl_certificate     TLS_CERT;
    ssl_certificate_key TLS_KEY;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:sub_agg_ssl:10m;
    ssl_session_timeout  10m;

    # Client apps expect small bodies, but include a small buffer for headers.
    client_max_body_size 8k;
    client_body_buffer_size 4k;
    client_header_timeout 5s;
    client_body_timeout   5s;
    send_timeout          15s;

    # Prevent snooping of headers via TRACE and friends.
    if ($request_method !~ ^(GET|HEAD|POST)$ ) { return 405; }

    ## Public subscription route.
    location / {
        limit_req zone=sub_agg_zone burst=15 nodelay;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Forward the client User-Agent so the aggregator can pass it upstream
        # (FR-2). undici uses the header as-is on outbound requests.
        proxy_set_header   User-Agent        $http_user_agent;

        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
        proxy_buffering       off;
    }

    ## Internal management — never reachable from the internet.
    location /internal/ {
        deny all;
        return 403;
    }

    ## Prometheus metrics — WG-only.
    location = /metrics {
        allow WG_CIDR;
        deny all;
        proxy_pass http://127.0.0.1:8080/metrics;
    }

    ## Health endpoints — open (front stream uses TCP passthrough so it
    ## can't do L7 checks; the DNS failover uses HTTPS via curl --resolve).
    location = /healthz { proxy_pass http://127.0.0.1:8080/healthz; access_log off; }
    location = /readyz  { proxy_pass http://127.0.0.1:8080/readyz;  access_log off; }
}
