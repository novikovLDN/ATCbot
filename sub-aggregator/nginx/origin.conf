## nginx/origin.conf — deploy on the bot server (origin).
##
## Terminates TLS for <SUB_DOMAIN>. Forwards to 127.0.0.1:8080 (aggregator).
## /internal/ is denied from the outside (defence-in-depth on top of the
## secret headers). /metrics is exposed only to the WireGuard subnet.
##
## Variables to substitute before install (или используй scripts/install-origin.sh):
##   SUB_DOMAIN — новый домен агрегатора (e.g. subscription.palantirdns.uk)
##   ACME_DIR   — путь к webroot для acme-challenge (например /var/www/acme)
##   TLS_CERT   — /etc/letsencrypt/live/${SUB_DOMAIN}/fullchain.pem
##   TLS_KEY    — /etc/letsencrypt/live/${SUB_DOMAIN}/privkey.pem
##   TLS_DHPARAM — /etc/nginx/dhparam.pem (openssl dhparam -out ... 2048)
##   WG_CIDR    — WireGuard subnet allowed to hit /metrics (e.g. 10.8.0.0/24)
##   FRONT_WG_1 — WG-адрес RF-1 фронта (например 10.8.0.2)
##   FRONT_WG_2 — WG-адрес RF-2 фронта (например 10.8.0.3)

# Rate-limit zone shared across workers. 30 req/min per REAL client IP.
# real_ip_from ниже гарантирует, что $binary_remote_addr — это IP юзера,
# а не WG-адрес фронта; иначе весь трафик от RF-1 считался бы за один ключ.
limit_req_zone $binary_remote_addr zone=sub_agg_zone:10m rate=30r/m;

server {
    listen 80;
    server_name  SUB_DOMAIN;

    # ACME challenge — pass through, everything else redirects.
    location /.well-known/acme-challenge/ {
        root ACME_DIR;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/1.1 ONLY — HTTP/2 ломает часть VPN-клиентов на длинных base64
    # подписках (Streisand < 1.3, ранние v2rayNG). Ничего не теряем: сервис
    # не многоплексирует, короткие ответы.
    #
    # proxy_protocol — читаем PROXY-protocol v2 от фронтов (RF-1/RF-2),
    # чтобы видеть реальный IP клиента для rate-limit и логов.
    listen 443 ssl proxy_protocol;
    server_name  SUB_DOMAIN;

    ## ── Реальный IP клиента ────────────────────────────────────────
    # Фронты (RF-1/RF-2) при `proxy_protocol on;` в stream {} шлют
    # реальный IP клиента. Доверяем только этим двум адресам.
    set_real_ip_from FRONT_WG_1;
    set_real_ip_from FRONT_WG_2;
    real_ip_header proxy_protocol;

    ## ── TLS ────────────────────────────────────────────────────────
    ssl_certificate     TLS_CERT;
    ssl_certificate_key TLS_KEY;
    ssl_dhparam         TLS_DHPARAM;

    # TLSv1.3 приоритет — быстрее handshake, меньше DPI-fingerprint.
    # TLSv1.2 fallback для старых Android VPN-клиентов.
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLSv1.3 выбирает клиент — оставляем ему
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve       X25519:prime256v1;

    ssl_session_cache    shared:sub_agg_ssl:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;         # без tickets — forward secrecy

    # OCSP stapling — снижает handshake, важно на плохих РФ-каналах.
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver             1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout     5s;

    # HSTS + security-headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Default type — sub body отдаётся как text/plain (для клиентов).
    default_type text/plain;
    charset utf-8;
    charset_types text/plain text/html application/json;

    # Клиенты шлют только GET — POST только на /internal (см. ниже).
    client_max_body_size 8k;
    client_body_buffer_size 4k;
    client_header_timeout 5s;
    client_body_timeout   5s;
    send_timeout          15s;

    # Prevent snooping of headers via TRACE and friends.
    if ($request_method !~ ^(GET|HEAD|POST)$ ) { return 405; }

    ## Public subscription route.
    location / {
        limit_req zone=sub_agg_zone burst=15 nodelay;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Forward the client User-Agent so the aggregator can pass it upstream
        # (FR-2) и различать браузер/клиент (src/ua.js).
        proxy_set_header   User-Agent        $http_user_agent;

        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
        proxy_buffering       off;
    }

    ## Internal management — never reachable from the internet.
    location /internal/ {
        # Разрешаем ТОЛЬКО с origin (loopback) и WG-сети (бот на другом хосте
        # через WG). Публичные фронты не проксируют /internal — они на L4
        # и не смотрят URL, но deny здесь = defence-in-depth: если кто-то
        # научится DNS-hijack и попадёт мимо фронтов, /internal всё равно
        # закрыт.
        allow 127.0.0.1;
        allow WG_CIDR;
        deny all;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_pass_request_headers on;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    ## Prometheus metrics — WG-only.
    location = /metrics {
        allow 127.0.0.1;
        allow WG_CIDR;
        deny all;
        proxy_pass http://127.0.0.1:8080/metrics;
    }

    ## Health endpoints — open (front stream uses TCP passthrough so it
    ## can't do L7 checks; the DNS failover uses HTTPS via curl --resolve).
    location = /healthz { proxy_pass http://127.0.0.1:8080/healthz; access_log off; }
    location = /readyz  { proxy_pass http://127.0.0.1:8080/readyz;  access_log off; }
}
